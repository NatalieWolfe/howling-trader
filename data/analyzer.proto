syntax = "proto3";

package howling;

message Analyzer {
  enum Period {
    PERIOD_UNSPECIFIED = 0;
    ONE = 1;
    FIVE = 2;
    TWENTY = 3;
  }

  enum Type {
    TYPE_UNSPECIFIED = 0;
    ATR = 8;
    BOLLINGER = 2;
    EMA_RIBBON = 11;
    GAP_MOMENTUM = 13;
    HOWLING = 3;
    MACD = 4;
    MARKET_HOURS = 5;
    NOOP = 1;
    PIVOT_POINTS = 12;
    PROFIT = 6;
    RSI = 10;
    VWAP = 9;
    ZIG_ZAG = 7;
  }

  message Atr {
    // Optional. Wilder RMA smoothing period in bars. Default 14.
    int32 period = 1;
    // Optional. Number of recent ATR samples in the historical baseline.
    // Default 60.
    int32 baseline_period = 2;
    // Optional. Ratio of current ATR to baseline ATR that triggers a HOLD
    // decision. Default 1.5.
    double high_volatility_ratio = 3;
    // Required. Aggregation candle timeframe to evaluate ATR on.
    Period candle_period = 4;
  }
  message Bollinger {}
  message EmaRibbon {
    // Optional. EMA periods forming the ribbon (at least two positive unique
    // values). Defaults to [9, 21, 50].
    repeated int32 periods = 1;
    // Optional. Minimum relative spread between fastest and slowest EMAs
    // required to emit a directional signal. Defaults to 0.001.
    double min_spread_ratio = 2;
    // Optional. Scales relative ribbon spread into signal confidence in
    // [0.0, 1.0]. Defaults to 100.0, reaching full confidence around a ~1%
    // intraday EMA separation typical of a strong equity trend; tune higher
    // for lower-volatility stocks or lower for volatile ones.
    double confidence_scaler = 3;
    // Required. Candle aggregation period used to feed the EMA ribbon.
    Period candle_period = 4;
  }
  message GapMomentum {
    // Optional. Minimum overnight gap percentage for Gap and Go momentum
    // signals. Defaults to 0.02.
    double momentum_gap_threshold = 1;
    // Optional. Minimum overnight gap percentage for Gap Fill mean-reversion
    // signals. Defaults to 0.03.
    double fill_gap_threshold = 2;
    // Optional. Minimum relative opening volume required for Gap and Go
    // signals. Defaults to 1.5.
    double high_relative_volume = 3;
    // Optional. Maximum relative opening volume for Gap Fill signals.
    // Defaults to 0.8.
    double low_relative_volume = 4;
    // Optional. Duration in minutes of the initial opening range window.
    // Defaults to 5.
    int32 opening_window_minutes = 5;
    // Optional. Duration in minutes after market open during which signals are
    // active. Defaults to 90.
    int32 active_window_minutes = 6;
    // Optional. Number of prior trading days used to compute the average
    // opening-window volume baseline. Defaults to 10.
    int32 volume_baseline_days = 7;
  }
  message Howling {}
  message Macd {
    enum Period {
      option deprecated = true;
      PERIOD_UNSPECIFIED = 0;
      ONE = 1;
      FIVE = 2;
      TWENTY = 3;
    }
    Period period = 1;
    double crossover_scaler = 2;
  }
  message MarketHours {
    // Optional. Opening hour in 24-hour format (e.g. 9.5 for 9:30 AM).
    // Default 10.
    float open_hour = 1;
    // Optional. Closing hour in 24-hour format (e.g. 16.0 for 4:00 PM).
    // Default 15.5.
    float close_hour = 2;
  }
  message Noop {}
  message PivotPoints {
    // Optional. Fractional proximity band around a pivot level (e.g., 0.002
    // for 0.2%). Must be in (0.0, 1.0). Default 0.002.
    double proximity_threshold = 1;
    // Optional. Confidence scaling factor applied to base level confidences.
    // Must be positive and finite. Default 1.0.
    double confidence_scaler = 2;
    // Optional. Base confidence for major levels (R2 and S2), in (0.0, 1.0].
    // Default 1.0.
    double major_confidence = 3;
    // Optional. Base confidence for minor levels (R1 and S1), in (0.0, 1.0].
    // Default 0.7.
    double minor_confidence = 4;
  }
  message Profit {}
  message Rsi {
    // Optional. Wilder RMA smoothing period in bars. Default 14.
    int32 period = 1;
    // Optional. RSI level below which a BUY/HOLD signal is emitted.
    // Default 30.0.
    double oversold_threshold = 2;
    // Optional. RSI level above which a SELL/HOLD signal is emitted.
    // Default 70.0.
    double overbought_threshold = 3;
    // Required. Aggregation candle timeframe to evaluate RSI on.
    Period candle_period = 4;
  }
  message Vwap {
    enum Mode {
      MODE_UNSPECIFIED = 0;
      // Follows intraday trend direction via price crossovers above/below VWAP.
      TREND_FILTER = 1;
      // Fades extended price deviations beyond deviation_threshold from VWAP.
      MEAN_REVERSION = 2;
    }
    // Optional. Signal generation mode. Defaults to TREND_FILTER.
    Mode mode = 1;
    // Optional. Minimum relative deviation from VWAP for signal generation and
    // confidence scaling. Defaults to 0.002.
    double deviation_threshold = 2;
    // Optional. Minimum number of session candles required before emitting
    // signals. Defaults to 5.
    int32 min_candles = 3;
    // Optional. Whether to include pre-market and after-hours candles in VWAP
    // calculation. Defaults to false.
    bool include_extended_hours = 4;
  }
  message ZigZag { double threshold = 1; }

  oneof type {
    Atr atr = 8;
    Bollinger bollinger = 2;
    EmaRibbon ema_ribbon = 11;
    GapMomentum gap_momentum = 13;
    Howling howling = 3;
    Macd macd = 4;
    MarketHours market_hours = 5;
    Noop noop = 1;
    PivotPoints pivot_points = 12;
    Profit profit = 6;
    Rsi rsi = 10;
    Vwap vwap = 9;
    ZigZag zig_zag = 7;
  }
}
