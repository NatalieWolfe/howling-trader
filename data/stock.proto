syntax = "proto3";

import "google/protobuf/duration.proto";
import "google/protobuf/timestamp.proto";
import "data/candle.proto";

package howling.stock;

// Available symbols for trading.
//
// Next tag: 22
enum Symbol {
  SYMBOL_UNSPECIFIED = 0;
  AAPL = 2;
  ANT = 7;
  AMD = 4;
  AMZN = 8;
  ARM = 9;
  AVGO = 10;
  COIN = 11;
  CRWD = 12;
  GOOGL = 13;
  INTC = 5;
  META = 14;
  MRVL = 15;
  MSFT = 16;
  MSTF = 17;
  MU = 3;
  NFLX = 18;
  NVDA = 1;
  PLTR = 19;
  RIVN = 6;
  SMCI = 20;
  TSLA = 21;
}

message History {
  Symbol symbol = 1;
  google.protobuf.Timestamp started_at = 2;
  google.protobuf.Duration duration = 3;
  repeated Candle candles = 4;
}

message Position {
  Symbol symbol = 1;
  double price = 2;
  int64 quantity = 3;
}
